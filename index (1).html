<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111b21">
<title>Midnight Chat — AU</title>
<style>
:root{--bg:#0b141a;--panel:#111b21;--panel2:#202c33;--line:#26343d;--text:#e9edef;--muted:#8696a0;--green:#005c4b;--green2:#00a884;--incoming:#202c33}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:0}
.app{width:100%;max-width:520px;height:100dvh;max-height:960px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 60px #0007}
.topbar{height:66px;flex-shrink:0;background:var(--panel);display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.back{font-size:25px;color:#aebac1;line-height:1}.avatar{width:42px;height:42px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#a18cd1,#fbc2eb);font-size:22px;color:#231c2c}
.person{flex:1;min-width:0}.person h1{font-size:16px;font-weight:600;margin:0 0 4px}.person p{font-size:12px;color:var(--muted);margin:0}.top-actions{display:flex;gap:16px;color:#b9c6cc;font-size:20px}.top-actions button{background:none;border:0;color:inherit;font-size:20px;padding:4px;cursor:pointer}
.storybar{background:#0e171d;padding:9px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.storybar strong{color:#d5e3e9;font-weight:500}
.messages{flex:1;overflow-y:auto;padding:18px 12px 20px;background-color:var(--bg);background-image:radial-gradient(#1c2b33 0.7px,transparent 0.7px);background-size:14px 14px;scroll-behavior:smooth}
.day{text-align:center;margin:0 auto 18px;background:#182229;color:#aab7bd;padding:7px 12px;border-radius:8px;width:max-content;font-size:11px;box-shadow:0 1px 2px #0003}
.msg-row{display:flex;margin:7px 0;align-items:flex-end;gap:6px}.msg-row.mine{justify-content:flex-end}.bubble{max-width:83%;padding:8px 9px 6px;border-radius:9px;background:var(--incoming);font-size:14px;line-height:1.42;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 1px #0002;position:relative}.mine .bubble{background:var(--green);border-top-right-radius:3px}.theirs .bubble{border-top-left-radius:3px}.sender{display:block;color:#d7aefb;font-size:12px;font-weight:600;margin-bottom:3px}.mine .sender{color:#a9e6d4}.meta{display:flex;justify-content:flex-end;gap:4px;align-items:center;color:#a8c6bf;font-size:10px;margin-top:4px}.tick{font-size:12px;color:#53c8f0}
.composer-wrap{background:var(--panel);padding:9px 10px max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);flex-shrink:0}.sender-switch{display:flex;align-items:center;gap:8px;margin:0 3px 9px;font-size:11px;color:var(--muted)}.switch{border:1px solid #34434b;background:#1a272e;color:#dbe4e8;padding:5px 9px;border-radius:14px;font-size:11px;cursor:pointer}.switch.active{background:#075e51;border-color:#087e6b;color:#e7fff7}.compose{display:flex;gap:8px;align-items:flex-end}.inputbox{flex:1;min-width:0;background:var(--panel2);border-radius:24px;display:flex;align-items:flex-end;padding:8px 13px;gap:8px}.inputbox span{font-size:21px;color:#9eacb4;padding-bottom:2px}.inputbox textarea{width:100%;border:0;outline:0;resize:none;max-height:100px;min-height:24px;background:transparent;color:var(--text);font:14px Arial;line-height:1.4;padding:4px 0}.inputbox textarea::placeholder{color:#89979e}.send{width:45px;height:45px;border:0;border-radius:50%;background:var(--green2);color:#062b24;font-size:20px;cursor:pointer;flex-shrink:0}.hint{text-align:center;color:#667780;font-size:10px;margin-top:8px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #00a884;outline-offset:2px}.empty{color:var(--muted);text-align:center;margin-top:35%;font-size:13px}
@media(min-width:600px){body{padding:20px}.app{height:min(900px,calc(100dvh - 40px));border:1px solid #26343d;border-radius:12px}.topbar{border-radius:12px 12px 0 0}}
</style>
</head>
<body>
<main class="app" aria-label="Website chat AU">
  <header class="topbar">
    <span class="back" aria-hidden="true">‹</span>
    <div class="avatar" id="avatar">🌙</div>
    <div class="person"><h1 id="chatTitle">Aksa Pradipta</h1><p id="chatStatus">online</p></div>
    <div class="top-actions"><button id="editBtn" aria-label="Edit nama karakter" title="Edit karakter">✎</button><button id="menuBtn" aria-label="Menu" title="Menu">⋮</button></div>
  </header>
  <div class="storybar"><span>SIMULASI CHAT AU</span><strong>✦ episode 01</strong></div>
  <section class="messages" id="messages" aria-live="polite">
    <div class="day">HARI INI</div>
  </section>
  <footer class="composer-wrap">
    <div class="sender-switch"><span>Kirim sebagai:</span><button class="switch active" id="senderA">Kamu</button><button class="switch" id="senderB">Aksa</button></div>
    <form class="compose" id="chatForm">
      <div class="inputbox"><span aria-hidden="true">＋</span><textarea id="messageInput" rows="1" placeholder="Ketik pesan" aria-label="Ketik pesan"></textarea><span aria-hidden="true">☺</span></div>
      <button class="send" type="submit" aria-label="Kirim pesan">➤</button>
    </form>
    <div class="hint">Website AU fiksi • pesan tersimpan di browser ini</div>
  </footer>
</main>
<script>
const KEY='midnight-chat-au-v1';
const starter=[
 {sender:'b',text:'Kamu udah sampai rumah?',time:'21.04'},
 {sender:'a',text:'Baru aja. Kenapa?',time:'21.05'},
 {sender:'b',text:'Nggak apa-apa. Cuma mau mastiin kamu aman.',time:'21.05'},
 {sender:'a',text:'Tumben perhatian 🙄',time:'21.06'},
 {sender:'b',text:'Kalau sama kamu emang harus ada alasannya?',time:'21.06'}
];
let data={name:'Aksa Pradipta',you:'Kamu',emoji:'🌙',messages:starter};
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&Array.isArray(saved.messages))data=saved}catch(e){}
let sender='a';
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){ $('chatTitle').textContent=data.name; $('avatar').textContent=data.emoji||'🌙'; $('messages').innerHTML='<div class="day">HARI INI</div>';
 if(!data.messages.length)$('messages').innerHTML+='<div class="empty">Belum ada pesan. Mulai percakapanmu ✨</div>';
 data.messages.forEach(m=>{const mine=m.sender==='a';const row=document.createElement('div');row.className='msg-row '+(mine?'mine':'theirs');row.innerHTML='<div class="bubble">'+(!mine?'<span class="sender">'+escapeHTML(data.name)+'</span>':'')+escapeHTML(m.text)+'<div class="meta"><span>'+escapeHTML(m.time)+'</span>'+(mine?'<span class="tick">✓✓</span>':'')+'</div></div>';$('messages').appendChild(row)});
 $('messages').scrollTop=$('messages').scrollHeight;}
function setSender(s){sender=s;$('senderA').classList.toggle('active',s==='a');$('senderB').classList.toggle('active',s==='b');$('messageInput').placeholder=s==='a'?'Ketik pesan sebagai '+data.you:'Ketik pesan sebagai '+data.name}
$('senderA').onclick=()=>setSender('a');$('senderB').onclick=()=>setSender('b');
$('chatForm').addEventListener('submit',e=>{e.preventDefault();const input=$('messageInput');const text=input.value.trim();if(!text)return;const now=new Date();data.messages.push({sender,text,time:now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',hour12:false})});save();render();input.value='';input.style.height='24px';input.focus()});
$('messageInput').addEventListener('input',e=>{e.target.style.height='24px';e.target.style.height=Math.min(e.target.scrollHeight,100)+'px'});
$('editBtn').onclick=()=>{const name=prompt('Nama karakter lawan chat:',data.name);if(name&&name.trim())data.name=name.trim();const you=prompt('Nama karakter kamu:',data.you);if(you&&you.trim())data.you=you.trim();const emoji=prompt('Emoji foto profil (misalnya 🌙):',data.emoji);if(emoji&&emoji.trim())data.emoji=emoji.trim();save();render();setSender(sender)};
$('menuBtn').onclick=()=>{if(confirm('Hapus semua pesan di chat ini?')){data.messages=[];save();render()}};
render();setSender('a');
</script>
</body>
</html>
